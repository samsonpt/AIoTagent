[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiot-pcb-agent"
version = "0.1.0"
description = "PCB 产线自主工艺与运维智能体（AIoT Agentic MVP）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "numpy>=1.26",
    "openai>=1.40",
    "paho-mqtt>=2.0",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["common*", "sim*", "edge*", "twin*", "cloud*", "guard*", "ui*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# langsmith 的 pytest 插件在加载时 import requests，环境依赖版本不匹配会在 filterwarnings 生效前输出警告
addopts = "-q --import-mode=importlib -p no:langsmith_plugin"
pythonpath = ["."]
markers = [
    "live: 需要 DEEPSEEK_API_KEY 的真实 API 测试",
]
