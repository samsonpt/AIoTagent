[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiot-pcb-agent"
version = "0.1.0"
description = "PCB 产线自主工艺与运维智能体（AIoT Agentic MVP）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["common*", "sim*", "edge*", "twin*", "cloud*", "guard*", "ui*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
